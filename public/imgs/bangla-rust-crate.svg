<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="150" r="250" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="300" fill="#818cf8" opacity="0.1" filter="url(#glow)" />

  <!-- Card Border Container -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Category Badge -->
  <rect x="110" y="110" width="124" height="40" rx="20" fill="url(#accentGrad)" />
  <text x="130" y="136" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">OTHERS</text>

  <!-- Project Title -->
  <text x="110" y="270" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Bangla Rust Crate</text>

  <!-- Divider Line -->
  <line x1="110" y1="330" x2="300" y2="330" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Keywords / Tags -->
  <text x="110" y="420" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">#rust   #crate   #bangla   #bengali</text>

  <!-- Footer Watermark -->
  <text x="1050" y="520" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#64748b">sayed.app</text>
</svg>